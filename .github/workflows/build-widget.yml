name: Build Nutrition Live Widget APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Android project
        run: |
          curl -L --fail -o source.zip "https://271dd665-58ff-4f87-8ec2-919453d21d8e.usrfiles.com/archives/e3fd80_39b8334c6b3344a780193ee0c048d04b.zip"
          unzip source.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nutrition-Live-Widget-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
