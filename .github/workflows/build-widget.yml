name: Build Nutrition Live Widget APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        run: |
          mkdir -p project/app/src/main/java/com/romskub/nutritionlive
          mkdir -p project/app/src/main/res/layout
          mkdir -p project/app/src/main/res/drawable
          mkdir -p project/app/src/main/res/xml
          mkdir -p project/app/src/main/res/values

          base="https://headless-rjcepryafyz-romskub-1407.wix-site-host.com"

          curl -fL "$base/settings.gradle" -o project/settings.gradle
          curl -fL "$base/build.gradle" -o project/build.gradle
          curl -fL "$base/app/build.gradle" -o project/app/build.gradle
          curl -fL "$base/app/src/main/AndroidManifest.xml" -o project/app/src/main/AndroidManifest.xml
          curl -fL "$base/app/src/main/java/com/romskub/nutritionlive/MainActivity.java" -o project/app/src/main/java/com/romskub/nutritionlive/MainActivity.java
          curl -fL "$base/app/src/main/java/com/romskub/nutritionlive/NutritionWidgetProvider.java" -o project/app/src/main/java/com/romskub/nutritionlive/NutritionWidgetProvider.java
          curl -fL "$base/app/src/main/res/layout/activity_main.xml" -o project/app/src/main/res/layout/activity_main.xml
          curl -fL "$base/app/src/main/res/layout/widget_nutrition.xml" -o project/app/src/main/res/layout/widget_nutrition.xml
          curl -fL "$base/app/src/main/res/drawable/widget_bg.xml" -o project/app/src/main/res/drawable/widget_bg.xml
          curl -fL "$base/app/src/main/res/xml/nutrition_widget_info.xml" -o project/app/src/main/res/xml/nutrition_widget_info.xml
          curl -fL "$base/app/src/main/res/values/strings.xml" -o project/app/src/main/res/values/strings.xml
          curl -fL "$base/app/src/main/res/values/styles.xml" -o project/app/src/main/res/values/styles.xml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nutrition-Live-Widget-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
